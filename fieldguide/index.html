<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor Mindset Field Guide · Wilderland staff</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#015640">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<style>
@font-face{font-family:"Uncut Sans";src:url(/books/f/us-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Uncut Sans";src:url(/books/f/us-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Inter";src:url(/books/f/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  /* One dark world, matching Explore. Lamp green = mentor, ember = enforcer, sky = protector. Layout: trail map home, each stop its own view. */
  color-scheme:dark;
  --ink:#08140f;--shelf:#0f231c;--shelf2:#16302a;--line:#28493d;--paper:#f6f8ea;--dim:#a9bbb0;
  --lamp:#d5f367;--forest:#015640;--ember:#ff9076;--ember-bg:#3a1c16;--sky:#93c9ff;--sky-bg:#15293d;--lamp-bg:#22331a;
  --display:"Uncut Sans",Inter,system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5.4vw,50px)} h2{font-size:clamp(22px,3vw,28px)} h3{font-size:18px}
h1 span,h2 span{color:var(--lamp)}
p{margin:0;max-width:66ch} a{color:var(--lamp)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 90px}
.trail{position:sticky;top:0;z-index:30;background:rgba(8,20,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.trail nav{display:flex;flex-wrap:wrap;gap:6px;padding:9px 18px}
@media (max-width:700px){.trail{position:static}}
@media (max-width:520px){.wl-ls span{display:none}.wlbar .wl-ls{padding:8px 4px!important;font-size:13px!important}}
.trail nav::-webkit-scrollbar{display:none}
.trail a{flex:none;text-decoration:none;color:var(--dim);font:600 13.5px/1 var(--body);padding:9px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.trail a[aria-current=page]{background:var(--lamp);color:#0b2b20;border-color:var(--lamp)}
.view{display:flex;flex-direction:column;gap:20px;padding-top:28px}
.lede{font-size:18px;color:#cfdbd1}
.dim{color:var(--dim)} .small{font-size:13.5px;color:var(--dim)}
.card{background:var(--shelf);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.tag{display:inline-block;align-self:flex-start;font:700 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.E{color:var(--ember);border-color:var(--ember)}.tag.P{color:var(--sky);border-color:var(--sky)}.tag.M{color:var(--lamp);border-color:var(--lamp)}
.E-edge{border-left:5px solid var(--ember)}.P-edge{border-left:5px solid var(--sky)}.M-edge{border-left:5px solid var(--lamp)}
.say{background:var(--lamp-bg);border:1px solid rgba(213,243,103,.35);border-radius:12px;padding:11px 13px;font-weight:600}
.nope{background:var(--ember-bg);border-radius:12px;padding:11px 13px}
.btn{font:700 14.5px/1 var(--body);color:#0b2b20;background:var(--lamp);border:0;border-radius:11px;padding:13px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.btn.warn{background:var(--ember);color:#2a0d07}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13.5px/1 var(--body);color:var(--dim);background:var(--shelf);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.chip[aria-pressed=true]{color:#0b2b20;background:var(--lamp);border-color:var(--lamp)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=search],input[type=url],input[type=email],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-weight:400;font-size:16px}
textarea{min-height:110px;resize:vertical}
label.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
label.check input{margin-top:4px;width:18px;height:18px;flex:none}
/* gate */
.gate{max-width:520px;margin:12vh auto 0;text-align:center;align-items:center}
/* map */
.map{background:linear-gradient(#0c2a22,#08140f);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map a text{font:700 15px var(--display);fill:#f6f8ea;paint-order:stroke;stroke:#08140f;stroke-width:5px;stroke-linejoin:round}
.map a .n{stroke:none}
.view>.chip{align-self:flex-start}
.map a .n{font:700 15px var(--display);fill:#0b2b20}
.map a circle{transition:r .15s}
.map a:hover circle,.map a:focus circle{r:22}
.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.stop{text-decoration:none;color:var(--paper);background:var(--shelf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stop:hover{border-color:var(--lamp)}
.stop b{font:700 18px var(--display)}.stop i{font-style:normal;color:var(--lamp);font:700 12px var(--body);letter-spacing:.08em}
.stop span{color:var(--dim);font-size:14px}
/* quadrant */
.quad{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px}
.quad .ylab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center}
.quad button{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:14px;min-height:118px;display:flex;flex-direction:column;gap:5px;border:2px solid var(--line);font-size:14px;transition:transform .12s,background .12s}
.quad button:hover{transform:translateY(-2px)}
.quad button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.quad button b{font:700 19px var(--display)}
.quad .qE{background:#4a2218;border-color:var(--ember)}.quad .qM{background:#2e4a1c;border-color:var(--lamp)}.quad .qP{background:#1c3b5c;border-color:var(--sky)}.quad .qA{background:#2a3d37;border-color:#7d968b}
.quad button[aria-pressed=true]{color:var(--ink);box-shadow:0 0 0 3px var(--paper)}
.quad button[aria-pressed=true].qE{background:var(--ember)}.quad button[aria-pressed=true].qM{background:var(--lamp)}.quad button[aria-pressed=true].qP{background:var(--sky)}.quad button[aria-pressed=true].qA{background:#c4d3ca}
.axis{display:flex;justify-content:space-between;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-left:38px}
/* anatomy */
.anat{display:flex;flex-direction:column;gap:8px}
.anat div{border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;background:var(--shelf2)}
.anat b{font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--lamp)}
/* stats */
.stat .big{font:700 clamp(34px,6vw,46px)/1 var(--display);color:var(--lamp);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:132px 1fr 52px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .t{height:16px;background:var(--ink);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--dim)}
.bar.hi .t i{background:var(--lamp)}
/* flip cards */
.flip{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-radius:16px;min-height:150px;padding:16px;border:1px solid var(--line);background:var(--shelf)}
.flip .f{display:flex;flex-direction:column;gap:10px;height:100%}
.flip .q{font:700 19px/1.25 var(--display)}
.flip .hint{margin-top:auto;font-size:12.5px;color:var(--dim)}
.flip.E{border-top:5px solid var(--ember)}.flip.P{border-top:5px solid var(--sky)}
.flip.on{background:var(--lamp-bg);border-color:var(--lamp)}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15.5px}
.bub.s{align-self:flex-start;background:var(--shelf2);border-bottom-left-radius:4px}
.bub.g{align-self:flex-end;background:var(--lamp-bg);border:1px solid rgba(213,243,103,.35);border-bottom-right-radius:4px;font-weight:600}
.bub small{display:block;font:700 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
/* steps */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps div{counter-increment:s;background:var(--shelf2);border-radius:14px;padding:14px;font-size:14.5px}
.steps div::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lamp);color:#0b2b20;font:700 14px var(--display);margin-bottom:8px}
.steps b{display:block}
/* scores */
.score{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--ink);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--lamp);border-radius:99px}
.total{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.msg{white-space:pre-wrap;border-radius:14px;padding:12px 14px;max-width:72ch}
.msg.u{background:var(--shelf2);align-self:flex-end}.msg.a{background:var(--shelf);border:1px solid var(--line)}
.thread{display:flex;flex-direction:column;gap:10px}
/* sessions */
.kid{all:unset;box-sizing:border-box;cursor:pointer;background:var(--shelf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.kid:hover{border-color:var(--lamp)}.kid b{font:700 20px var(--display)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);margin-right:6px}.dot.ok{background:var(--lamp)}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.recbtn{all:unset;cursor:pointer;width:96px;height:96px;border-radius:50%;background:var(--ember);display:grid;place-items:center;font:700 14px var(--display);color:#2a0d07;box-shadow:0 0 0 8px rgba(255,144,118,.15)}
.recbtn.on{background:var(--paper);color:var(--ink);animation:pulse 1.6s infinite}
.recbtn:disabled{opacity:.4;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(255,144,118,.25)}}
.clock{font:700 30px var(--display);font-variant-numeric:tabular-nums}
.live{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:90px;max-height:210px;overflow:auto;font-size:15px;white-space:pre-wrap}
.live em{color:var(--dim);font-style:normal}
.tipdock{position:sticky;bottom:10px;background:var(--shelf2);border:1px solid var(--lamp);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.nudge{background:var(--sky-bg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.skill{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rate{display:flex;gap:4px}.rate button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--ink);font-weight:700;cursor:pointer}
.rate button[aria-pressed=true]{background:var(--lamp);color:#0b2b20;border-color:var(--lamp)}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:700}
@media (max-width:520px){.bar{grid-template-columns:104px 1fr 44px}.anat div{grid-template-columns:1fr}.map a text{font-size:19px}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}.map a circle{transition:none}}
</style>
</head>

<div class="trail" id="trail" hidden><nav id="nav" aria-label="Field guide stops"></nav></div>
<main class="wrap" id="app">

</main>

</html>

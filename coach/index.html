<!doctype html>
<html lang="en" class="foxhalf">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Fox · Wilderland</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#01412f">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<style>
@font-face{font-family:"Inter";src:url(/books/f/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Uncut Sans";src:url(/books/f/us-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--ink:#14231c;--dim:#56665c;--line:#dfe6d6;--paper:#f7f9f1;--card:#fff;--green:#01412f;--lime:#d5f367}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:36px 18px 80px;display:flex;flex-direction:column;gap:28px}
/* Half the page is Mr. Fox (the dock, on the right), the other half the instructions. coach.js draws the chat into the
   dock with WLCoach.home({ dock }); these rules turn its side panel into a column of the page. */
html.foxhalf{--wlc-w:max(420px,50vw)}
html.wlc-docked body.foxbody{margin-right:0;padding-bottom:0}
.foxpage{display:grid;grid-template-columns:minmax(0,1fr) var(--wlc-w);align-items:start}
.foxpage>main{max-width:680px;width:100%}
.foxdock{position:sticky;top:0;height:100vh;border-left:1px solid var(--line)}
.foxdock .wlc{position:relative;inset:auto;width:100%;height:100%;transform:none;transition:none;z-index:auto;border-left:0;box-shadow:none}
.foxdock .wlc-size{display:none}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li b{display:block}
@media (max-width:860px){
  .foxpage{display:flex;flex-direction:column}
  .foxdock{order:-1;position:relative;height:min(78vh,640px);border-left:0;border-bottom:1px solid var(--line)}
  .foxdock .wlc{top:auto;left:auto;border-radius:0;border-top:0}
  .foxdock .wlc .wlc-head{border-radius:0}
}
h1,h2{font-family:"Uncut Sans",Inter,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.12;margin:0}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:24px}
p{margin:0}
.lede{font-size:18px;color:var(--dim);max-width:60ch;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.card:hover{border-color:var(--green)}
.card .k{font:700 11.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.card b{font:700 20px/1.2 "Uncut Sans",Inter,sans-serif}
.card p{color:var(--dim);font-size:15px}
.card i{font-style:normal;font-weight:600;color:var(--green);margin-top:auto}
.card.lead{background:var(--green);color:#fff;border-color:var(--green)}
.card.lead .k,.card.lead i{color:var(--lime)} .card.lead p{color:#d8e6dc}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;list-style:none;padding:0;margin:0}
.rules li{background:#eef4d6;border-radius:12px;padding:14px 16px;font-size:15px}
.rules b{display:block;font-size:16px;margin-bottom:2px}
.chats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chats button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chats button:hover{border-color:var(--green)}
.chats button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.chats .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef4d6;color:var(--green);flex:none;font-weight:700}
.chats .tx{flex:1;min-width:0}
.chats .tt{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chats .ls{color:var(--dim);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chats .dt{color:var(--dim);font-size:13px;flex:none}
.empty,.msg{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--dim)}
.btn{border:0;border-radius:999px;background:var(--lime);color:#0b2b20;font:600 15px Inter,sans-serif;padding:11px 16px;cursor:pointer}
.small{font-size:14px;color:var(--dim)}
.small a{color:var(--green)}
.subj{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:999px;padding:8px 14px;font:600 15px/1.2 Inter,sans-serif;cursor:pointer}
.chip:hover{background:#eef4d6}
.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.rules.why li{background:#fff;border:1px solid var(--line)}
.fox{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:.3em;background:var(--lime);vertical-align:-.12em;font-size:.9em}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
</style>
</head>
<body class="foxbody">
<div class="wlbar" data-wlnav="students" data-current="coach"></div><script src="/wlnav.js"></script>
<div class="foxpage">
<main>
  <!-- Everything about Mr. Fox (who he is, what he helps with, the rules) is in his conversation, not on the page. -->
  <header>
    <h1><span class="fox" aria-hidden="true">🦊</span> Mr. Fox</h1>
    <p class="lede">Grumpy. Helpful. Waiting for you.</p>
  </header>
  <section>
    <h2 style="margin-bottom:12px">Your conversations</h2>
    <div id="chats"><p class="msg">Loading…</p></div>
  </section>
</main>
<div class="foxdock" id="foxdock" aria-label="Mr. Fox"></div>
</div>
<script type="module" src="/coach/coach.js"></script>
<script type="module">
const FS = "https://firestore.googleapis.com/v1/projects/wilderland-df15e/databases/(default)/documents";
const box = document.getElementById("chats");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = ms => { const d = new Date(ms), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
const val = v => !v ? null : "stringValue" in v ? v.stringValue : "integerValue" in v ? Number(v.integerValue) : "booleanValue" in v ? v.booleanValue : null;
let seq = 0;
async function load(r) {
  const my = ++seq;
  const u = window.wlFirebase && window.wlFirebase.auth.currentUser;
  if (!u) { box.innerHTML = '<div class="msg">Sign in with your school account to see your chats. <button class="btn" type="button" data-wl-signin>Sign in</button></div>'; return; }
  if (r && r.role === "parent") { box.innerHTML = '<p class="msg">Mr. Fox is for students, signed in with their school account. Parents: see <a href="/parents/ai/">how it keeps students safe</a>.</p>'; return; }
  if (r && r.role === "student" && r.band === "K–1") { box.innerHTML = '<p class="msg">Mr. Fox is for grades 2 to 8. Your guide will help you with challenges.</p>'; return; }
  try {
    const q = await fetch(FS + ":runQuery", { method: "POST", headers: { Authorization: "Bearer " + await u.getIdToken(), "Content-Type": "application/json" },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId: "aiChats" }], where: { fieldFilter: { field: { fieldPath: "uid" }, op: "EQUAL", value: { stringValue: u.uid } } }, limit: 200 } }) });
    // A tester sees only the chats for the view they're in (the test student's, or their own staff tries).
    const isTest = !!(r && r.test);
    if (my !== seq) return;
    if (!q.ok) throw new Error(q.status);
    const chats = (await q.json()).filter(x => x.document).map(x => ({ id: x.document.name.split("/").pop(), ...Object.fromEntries(Object.entries(x.document.fields || {}).map(([k, v]) => [k, val(v)])) }))
      .filter(c => !!c.test === isTest).sort((a, b) => (b.updated || 0) - (a.updated || 0));
    const staffNote = r && r.role === "staff" ? '<p class="small" style="margin-bottom:10px">You are staff, so these are your own test chats. Every student conversation is on <a href="/guides/roster/">Guides › Student Roster</a>.</p>' : "";
    box.innerHTML = staffNote + (chats.length ? '<ul class="chats">' + chats.map(c => `<li><button type="button" data-chat="${c.id}"><span class="ic" aria-hidden="true">${{ project: "P", "find-project": "P", lesson: "?", academic: "A", conflict: "🤝", "find-challenge": "C" }[c.kind] || "C"}</span><span class="tx"><span class="tt">${esc(c.topicTitle || ({ lesson: "How to use your coach", academic: "Academics", conflict: "Working out a conflict", "find-challenge": "Finding a challenge", "find-project": "Finding a project" }[c.kind] || "Chat"))}</span><span class="ls">You: ${esc(c.last || "")}</span></span><span class="dt">${esc(when(c.updated || c.created || Date.now()))}</span></button></li>`).join("") + "</ul>"
      : '<p class="empty">No chats yet. Mr. Fox is waiting (grumpily).</p>');
  } catch (e) { box.innerHTML = '<p class="msg">Couldn\'t load your chats. Reload the page to try again.</p>'; }
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-chat]");
  if (c && window.WLCoach) { window.WLCoach.open({ chatId: c.getAttribute("data-chat") }); return; }
});
// Mr. Fox, open in the dock. Redrawn when sign-in settles, unless a conversation is already going.
const dock = document.getElementById("foxdock");
// Keep the dock inside the window: it starts below the top bar (and the test banner), so it's the window's height
// minus whatever is still above it. Once the page scrolls past the bars it fills the window. Wide screens only.
function fitDock() {
  if (matchMedia("(max-width:860px)").matches) { dock.style.height = ""; return; }
  const top = Math.max(0, dock.parentElement.getBoundingClientRect().top);
  dock.style.height = Math.max(320, innerHeight - top) + "px";
}
fitDock(); addEventListener("scroll", fitDock, { passive: true }); addEventListener("resize", fitDock);
new ResizeObserver(fitDock).observe(document.body);
function fox() { if (window.WLCoach && (!window.WLCoach.kind() || window.WLCoach.kind() === "home")) window.WLCoach.home({ dock }); }
fox();
document.addEventListener("wl-auth", fox);
document.addEventListener("wl-role", e => { load(e.detail); fox(); });
document.addEventListener("wl-coach-closed", () => load(window.wlRole));
if (window.wlRole !== undefined) load(window.wlRole);
setTimeout(() => { if (box.textContent.trim() === "Loading…" && !(window.wlFirebase && window.wlFirebase.auth.currentUser)) load(null); }, 4000);
</script>
<script type="module" src="/auth.js" data-site="coach"></script>
<script src="/challenges/modal.js"></script>
</body>
</html>

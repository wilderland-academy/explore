<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your conversations · Wilderland staff</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1d2b">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<style>
@font-face{font-family:"Inter";src:url(/books/f/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;--paper:#f5f1ea;--sheet:#fffdf9;--sheet2:#efe9df;--line:#ddd3c4;--ink:#231b24;--dim:#625a63;--warn:#a23620;
  --mentor:#0b6b3a;--behavior:#1d4e89;--parents:#8a2d55;--labs:#015640;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body)}
.wlbar{background:#2a1d2b}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:30px 18px 70px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:700 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
h1{font-size:clamp(28px,4.6vw,42px)}
.lede{color:var(--dim);max-width:62ch}
.gate{max-width:520px;margin:10vh auto 0;text-align:center;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f{all:unset;cursor:pointer;font:600 13.5px var(--body);padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:#fff}
.f[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.f:focus-visible{outline:2px solid var(--ink)}
.work{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:11px 13px;border-radius:8px;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--c)}
.item:hover{border-color:var(--c)}
.item[aria-current=true]{background:#fff;border-color:var(--c);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.item b{font-size:14.5px;line-height:1.35}
.item span{font-size:12.5px;color:var(--dim)}
.item:focus-visible{outline:2px solid var(--ink)}
.c-mentor{--c:var(--mentor)}.c-behavior{--c:var(--behavior)}.c-parents{--c:var(--parents)}.c-labs{--c:var(--labs)}
.view{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.vhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.vhead h2{font-size:22px}
.tag{font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font:600 14px var(--body);padding:9px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--c,#231b24);border-color:var(--c,#231b24);color:#fff}
.btn.del{color:var(--warn)}
.btn.del.sure{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--ink)}
.turn{display:flex;flex-direction:column;gap:6px}
.who{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.u .txt{white-space:pre-wrap;background:var(--sheet2);border-radius:8px;padding:10px 13px;font-size:15px}
.a .txt{font-size:15.5px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
.txt h4{font:700 16px var(--display);margin-top:4px}
.txt ul,.txt ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.txt pre{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;overflow-x:auto}
.txt table{border-collapse:collapse;font-size:14px}.txt td,.txt th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
mark{background:#fff1a6;border-radius:3px;padding:0 2px}
.empty{color:var(--dim);margin:auto;text-align:center;max-width:44ch}
.small{font-size:13px;color:var(--dim)}
@media (max-width:820px){.work{grid-template-columns:1fr}.list{max-height:none}}
</style>
</head>
<body>
<div class="wlbar"><div class="wlbar-in"><a class="wlbar-home" href="/" aria-label="Wilderland Explore home"><svg class="wlbar-mark" style="display:block;height:20px" viewBox="1000 490 1880 640" aria-hidden="true"><path d="M1655.83 862.635L1420.76 517L1023 1103.58H1458.91L1655.83 862.635Z" fill="white"/><path d="M2851.08 1104.71L2453.14 517.773L2055.38 1104.35L2851.08 1104.71Z" fill="#D5F367"/><path d="M2124.74 867.294L1936.99 637.184L1555.82 1104.3H1964.82L2124.74 867.294Z" fill="#00B451"/></svg></a><!--guides-nav--><nav class="wlguides" aria-label="Staff guides"><a class="hub" href="/guides/"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M2 0h5v5H2zM11 0h5v5h-5zM2 7h5v5H2zM11 7h5v5h-5z" fill="currentColor"/></svg>Guides</a><a class="mm" href="/fieldguide/"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M0 12 6 3l3 4 3-6 6 11z" fill="currentColor"/></svg><span>Mentor<span class="lg"> Mindset</span></span></a><a class="bh" href="/behavior/"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M0 1c4 0 5 9 9 9s5-9 9-9v11H0z" fill="currentColor" opacity=".9"/></svg>Behavior</a><a class="ls" href="/guides/lifeskills/"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 11 6 2l5 9zM9 11l4-7 4 7z" fill="currentColor"/></svg>Life Skills</a><a class="pc" href="/guides/parents/"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 1h16v10H1zM1 1l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Parent<span class="lg"> Comms</span></span></a></nav><!--/guides-nav--><span class="wlbar-auth" data-wl-auth></span></div></div><script>(function(n,a){if(n&&a)n.scrollLeft=a.offsetLeft-n.clientWidth/2+a.offsetWidth/2})(document.querySelector(".wlguides"),document.querySelector(".wlguides [aria-current]"))</script>

<main id="app"><section class="gate"><h2>Wilderland staff area</h2><p>Checking who's here…</p></section></main>
<script type="module" src="/auth.js" data-site="history"></script>
<script type="module">
// Your conversation history across the staff coaches (see /guides/log.js). Only you can see it.
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-lite.js";
import { coachLog, SITES } from "/guides/log.js";
const ADMINS = ["alex@wilderland.academy", "sarah@wilderland.academy", "shanan@wilderland.academy", "april@wilderland.academy", "scott@wilderland.academy"];
const GUESTS = ["ian@silverlineventures.com", "online@bodyform.com", "ian.silverberg@gmail.com"];
const KINDS = { practice: "Practice rep", coach: "Coach", newsletter: "Newsletter", service: "Customer service", event: "Event", Challenge: "Challenge", "Skill Lab": "Skill Lab", Project: "Project", Review: "Plan review" };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function h(tag, attrs, kids) { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else if (k.startsWith("on")) e[k] = attrs[k]; else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]); } (kids || []).forEach(c => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }); return e; }
const when = ms => { const d = new Date(ms || 0); const same = d.getFullYear() === new Date().getFullYear(); return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: same ? undefined : "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(CONFIRM|ADD|CHECK)([^\]]*)\]/g, "<mark>[$1$2]</mark>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
const INDICATORS = ["Life Skills Focus", "Student-Centered & Participatory", "Challenging Yet Exciting", "Real-World / Student-Relevant", "Limitless Mindset", "Unique Opportunities & Novelty", "Impressive to Parents", "Backed by Experts & Credible Research", "Test2Pass (Mastery Assessment)"];
// Lab builder replies carry the Workshop Scorecard as data; show it as a readable list.
function scorecardText(t) {
  return String(t).replace(/```scorecard\s*\n([\s\S]*?)```/, (all, json) => {
    try { const j = JSON.parse(json), s = (j.scores || []).slice(0, 9).map(n => Math.max(1, Math.min(3, Math.round(+n || 1)))); const nx = (j.next || []).slice();
      return "**" + s.reduce((a, b) => a + b, 0) + "/27** on the K-8 Life Skills Workshop Scorecard\n" + s.map((n, i) => "- " + INDICATORS[i] + ": " + n + " (" + ["", "Not yet", "Progressing", "Excellent"][n] + ")" + ((j.why || [])[i] ? ". " + j.why[i] : "") + (n < 3 && nx.length ? " To reach 3: " + nx.shift() : "")).join("\n");
    } catch (e) { return all; }
  });
}
function md(t) {
  const lines = scorecardText(t).replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += "<pre>" + esc(buf.join("\n")) + "</pre>"; continue; }
    const m = l.match(/^#{1,4}\s+(.*)/); if (m) { out += "<h4>" + inline(m[1]) + "</h4>"; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]); out += "<table>" + rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r => "<tr>" + r.trim().slice(1, -1).split("|").map(c => "<td>" + inline(c.trim()) + "</td>").join("") + "</tr>").join("") + "</table>"; continue; }
    if (/^\s*[-*•]\s+/.test(l)) { out += "<ul>"; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*[-*•]\s+/, "")) + "</li>"; out += "</ul>"; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { out += "<ol>"; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; out += "</ol>"; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += "<p>" + buf.map(inline).join("<br>") + "</p>";
  }
  return out;
}
// Where "Continue" goes. Parent Comms and the Lab builder reopen the conversation; the other coaches open fresh.
const continueHref = x => x.site === "parents" ? "/guides/parents/?t=" + encodeURIComponent(x.id) : x.site === "labs" ? "/guides/lifeskills/builder/?t=" + encodeURIComponent(x.id) : null;

let log = null, items = [], filter = (location.hash.slice(1) in SITES) ? location.hash.slice(1) : "all", openId = null, seq = 0;
function gate(msg) { app.innerHTML = ""; app.appendChild(h("section", { class: "gate" }, [h("h2", { text: "Wilderland staff area" }), h("p", { text: msg })])); }
async function onAuth(u) {
  const my = ++seq;
  if (!u) return gate("Sign in with your Wilderland account, top right, to see your conversations.");
  const email = (u.email || "").toLowerCase();
  let ok = ADMINS.includes(email) || GUESTS.includes(email);
  const db = getFirestore(window.wlFirebase.app);
  if (!ok) { try { ok = (await getDoc(doc(db, "staff", email))).exists(); } catch (e) { ok = false; } }
  if (my !== seq) return;
  if (!ok) return gate("This area is for Wilderland guides and staff. If that's you, ask Alex to add your account.");
  log = coachLog(db, u);
  app.innerHTML = ""; app.appendChild(h("p", { class: "small", text: "Loading your conversations…" }));
  try { items = await log.list(); } catch (e) { console.warn(e); if (my !== seq) return; return gate(e && e.code === "permission-denied" ? "The database rules for history aren't published yet. Tell Alex." : "Couldn't load your conversations. Check your connection and reload."); }
  if (my !== seq) return;
  draw();
}
(async () => {
  while (!window.wlFirebase) await new Promise(r => setTimeout(r, 50));
  document.addEventListener("wl-auth", e => onAuth(e.detail));
  const a = window.wlFirebase.auth; if (a.authStateReady) { await a.authStateReady(); onAuth(a.currentUser); }
})();
addEventListener("hashchange", () => { const k = location.hash.slice(1); filter = k in SITES ? k : "all"; if (log) draw(); });

function draw() {
  app.innerHTML = "";
  app.append(h("header", { style: "display:flex;flex-direction:column;gap:8px" }, [
    h("p", { class: "eyebrow", text: "Staff guides" }), h("h1", { text: "Your conversations" }),
    h("p", { class: "lede", text: "Every conversation with the Mentor Mindset coach, the Behavior coach, the Parent Communication coach and the Lab builder, newest first. Only you can see these. Nobody else, admins included, can open them." })]));
  const counts = { all: items.length }; items.forEach(x => counts[x.site] = (counts[x.site] || 0) + 1);
  app.append(h("div", { class: "filters", role: "group", "aria-label": "Show" }, [["all", "All"], ...Object.entries(SITES).map(([k, v]) => [k, v.label])].map(([k, lab]) =>
    h("button", { class: "f", "aria-pressed": String(filter === k), text: lab + " (" + (counts[k] || 0) + ")", onclick: () => { history.replaceState(null, "", k === "all" ? location.pathname : "#" + k); filter = k; draw(); } }))));
  const shown = items.filter(x => filter === "all" || x.site === filter);
  const list = h("div", { class: "list", role: "list" });
  if (!shown.length) list.appendChild(h("p", { class: "small", text: filter === "all" ? "Nothing yet. Conversations appear here after the coach replies." : "No " + SITES[filter].label + " conversations yet." }));
  shown.forEach(x => list.appendChild(h("button", { class: "item c-" + x.site, role: "listitem", "data-id": x.id, "aria-current": String(openId === x.id), onclick: () => open(x.id) }, [
    h("b", { text: x.title || "Conversation" }), h("span", { text: (SITES[x.site] ? SITES[x.site].label : x.site) + (KINDS[x.kind] ? " · " + KINDS[x.kind] : "") + " · " + when(x.updated) })])));
  const view = h("section", { class: "view", id: "view", "aria-live": "polite" }, [h("p", { class: "empty", text: shown.length ? "Pick a conversation to read it." : "" })]);
  app.append(h("div", { class: "work" }, [list, view]));
  if (openId && shown.some(x => x.id === openId)) open(openId);
}
async function open(id) {
  openId = id;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", "false"));
  const view = document.getElementById("view"); view.innerHTML = ""; view.appendChild(h("p", { class: "small", text: "Opening…" }));
  let x; try { x = await log.get(id); } catch (e) { x = null; }
  if (openId !== id) return;
  view.innerHTML = "";
  if (!x) { view.appendChild(h("p", { class: "empty", text: "This conversation couldn't be opened. It may have been deleted." })); return; }
  document.querySelector('.item[data-id="' + CSS.escape(id) + '"]')?.setAttribute("aria-current", "true");
  const site = SITES[x.site] || { label: x.site, href: "/guides/" };
  const del = h("button", { class: "btn del", text: "Delete" });
  del.onclick = async () => {
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Tap again to delete for good"; setTimeout(() => { del.classList.remove("sure"); del.textContent = "Delete"; }, 4000); return; }
    del.disabled = true; del.textContent = "Deleting…";
    try { await log.remove(id); items = items.filter(i => i.id !== id); openId = null; draw(); }
    catch (e) { del.disabled = false; del.textContent = "Couldn't delete. Try again"; }
  };
  const cont = continueHref(x);
  view.className = "view c-" + x.site;
  view.append(h("div", { class: "vhead" }, [
    h("div", { style: "flex:1 1 300px;display:flex;flex-direction:column;gap:4px" }, [h("span", { class: "tag", text: site.label + (KINDS[x.kind] ? " · " + KINDS[x.kind] : "") }), h("h2", { text: x.title || "Conversation" }), h("span", { class: "small", text: "Started " + when(x.created) + (x.updated !== x.created ? " · last reply " + when(x.updated) : "") })]),
    h("div", { class: "acts" }, [cont ? h("a", { class: "btn go", href: cont, text: "Continue" }) : h("a", { class: "btn", href: site.href, text: "Open " + site.label }), h("button", { class: "btn", text: "Copy", onclick: async e => { try { await navigator.clipboard.writeText((x.messages || []).map(m => (m.role === "user" ? "You:\n" : "Coach:\n") + m.content).join("\n\n")); e.target.textContent = "Copied"; } catch (er) { e.target.textContent = "Couldn't copy"; } } }), del])]));
  // The Lab builder sends Claude a long instruction as the first message; show the guide's request instead.
  const msgs = (x.messages || []).map((m, i) => i === 0 && m.role === "user" && x.meta && x.meta.firstShown ? { ...m, content: x.meta.firstShown } : m);
  msgs.forEach(m => view.appendChild(h("div", { class: "turn " + (m.role === "user" ? "u" : "a") }, [h("div", { class: "who", text: m.role === "user" ? "You" : (x.site === "labs" ? "Builder" : "Coach") }), m.role === "user" ? h("div", { class: "txt", text: m.content }) : h("div", { class: "txt", html: md(m.content) })])));
}
</script>
</body>

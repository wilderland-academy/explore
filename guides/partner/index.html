<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Partner · Wilderland staff</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#01412f">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<style>
@font-face{font-family:"Inter";src:url(/books/f/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;--bg:#fbfcf6;--side:#f1f4e9;--line:#dfe5d4;--ink:#14231c;--dim:#5c6b62;--forest:#0f3d2e;--lime:#d5f367;--warn:#a23620;
  --mentor:#0b6b3a;--behavior:#1d4e89;--parents:#8a2d55;--labs:#015640;--guide:#0f231c;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
p{margin:0}
#app{flex:1;min-height:0;display:flex}
.gate{max-width:520px;margin:12vh auto 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:10px}
.gate h2{margin:0;font-size:22px}
/* Left: every conversation, newest first */
.side{width:300px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);min-height:0}
.side-top{display:flex;flex-direction:column;gap:8px;padding:14px 12px 10px}
.newbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;background:var(--forest);color:#fff;font-weight:600;padding:11px 14px;cursor:pointer;text-align:left}
.newbtn span{font-size:20px;line-height:1}
.side input,.side select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
.threads{flex:1;overflow-y:auto;padding:0 8px 16px}
.grp{margin:12px 8px 4px;font:700 11.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.th{all:unset;box-sizing:border-box;display:flex;gap:9px;align-items:flex-start;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer}
.th:hover{background:rgba(15,61,46,.07)}
.th[aria-current=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.th:focus-visible{outline:2px solid var(--forest)}
.th i{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;background:var(--c);margin-top:1px}
.th b{display:block;font-weight:500;font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.c-guide{--c:var(--guide)}.c-mentor{--c:var(--mentor)}.c-behavior{--c:var(--behavior)}.c-parents{--c:var(--parents)}.c-labs{--c:var(--labs)}
.c-guide i{background:var(--lime);font-size:15px}
.none{padding:12px 10px;color:var(--dim);font-size:14px}
/* Right: the conversation */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:#fff;min-height:56px}
.mhead h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead .tag{font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--dim))}
.sidebtn{display:none}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.ib.del{color:var(--warn)}
.ib.del.sure{background:var(--warn);color:#fff;border-color:var(--warn)}
.log{flex:1;overflow-y:auto;padding:24px 18px 12px}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.m{max-width:100%;overflow-wrap:anywhere}
.m.me{align-self:flex-end;max-width:85%;background:var(--forest);color:#fff;border-radius:18px 18px 5px 18px;padding:10px 14px;white-space:pre-wrap}
.m.ai{display:flex;gap:12px;align-items:flex-start}
.m.ai .av{flex:none;width:32px;height:32px;border-radius:10px;background:var(--lime);display:grid;place-items:center;font-size:20px}
.m.ai.other .av{background:var(--c);color:#fff;font-size:13px;font-weight:700}
.m.ai .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.m.note{align-self:center;color:var(--dim);font-size:13.5px;text-align:center}
.txt h4{margin:4px 0 0;font-size:16px}
.txt ul,.txt ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:3px}
.txt pre{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
.txt table{border-collapse:collapse;font-size:14px}.txt td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
mark{background:#fff1a6;border-radius:3px;padding:0 2px}
.typing{color:var(--dim);font-size:14px;padding-left:44px}
.hello{display:flex;flex-direction:column;gap:12px;padding:6vh 0 10px}
.hello .big{width:58px;height:58px;border-radius:16px;background:var(--lime);display:grid;place-items:center;font-size:36px}
.hello h2{margin:0;font-size:26px;letter-spacing:-.01em}
.hello p{color:var(--dim);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--forest);background:#fff;color:var(--forest);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;line-height:1.25;cursor:pointer;text-align:left}
.chip:hover{background:#eef4d6}
.other-note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--dim);font-size:14px}
.foot{padding:10px 18px 14px;background:linear-gradient(transparent,var(--bg) 30%)}
.foot form{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:#fff;border:1.5px solid #cfd8c4;border-radius:18px;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.foot form:focus-within{border-color:var(--forest)}
.foot textarea{flex:1;resize:none;border:0;outline:0;min-height:40px;max-height:220px;padding:9px 0;font:inherit;background:none;color:inherit}
.send{height:40px;min-width:64px;border:0;border-radius:12px;background:var(--lime);color:#0b2b20;font-weight:700;cursor:pointer;padding:0 14px}
.send:disabled{opacity:.5;cursor:default}
.hint{max-width:780px;margin:6px auto 0;font-size:12px;color:var(--dim);text-align:center}
.scrim{display:none}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:90;width:min(320px,86vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:6px 0 30px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;z-index:89;background:rgba(0,0,0,.3)}
  .sidebtn{display:inline-flex}
  .mhead{padding:8px 12px}
  .log{padding:16px 12px 8px}
  .foot{padding:8px 10px 10px}
  .hello{padding-top:2vh}
  .hello h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
<!-- Installable as the "Wilderland Guides" app (Add to Home Screen): /guides/app/ -->
<link rel="manifest" href="/guides/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/guides/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Guides">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="wlbar" data-wlnav="guides"></div><script src="/wlnav.js"></script>
<div id="app"><section class="gate"><h2>Wilderland staff area</h2><p>Checking who's here…</p></section></div>
<script type="module" src="/auth.js" data-site="history"></script>
<script type="module">
// Trail Partner, full page: every conversation you've had with Wilderland's staff AI tools on the left (only you can see
// them: coachLog/{uid}, see /guides/log.js), the conversation on the right. Trail Partner conversations continue right
// here; ones from the Mentor Mindset coach, the Behavior coach, Parent Comms and the Lab builder open in their own tool.
// The 🐲 button in the top bar and Trail Partner's side panel lead here (/guides/partner/#<thread id> opens one).
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-lite.js";
import { coachLog, SITES } from "/guides/log.js";
import { STARTERS } from "/guides/mentor/mentor.js";
const KINDS = { practice: "Practice rep", coach: "Coach", newsletter: "Newsletter", service: "Customer service", event: "Event", Challenge: "Challenge", "Skill Lab": "Skill Lab", Project: "Project", Review: "Plan review" };
const ICON = { guide: "🐲", mentor: "M", behavior: "B", parents: "P", labs: "L" };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function h(tag, attrs, kids) { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else if (k.startsWith("on")) e[k] = attrs[k]; else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]); } (kids || []).forEach(c => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }); return e; }
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/\[(CONFIRM|ADD|CHECK)([^\]]*)\]/g, "<mark>[$1$2]</mark>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
function md(t) {
  const lines = String(t || "").replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += "<pre>" + esc(buf.join("\n")) + "</pre>"; continue; }
    const m = l.match(/^#{1,4}\s+(.*)/); if (m) { out += "<h4>" + inline(m[1]) + "</h4>"; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]); out += "<table>" + rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r => "<tr>" + r.trim().slice(1, -1).split("|").map(c => "<td>" + inline(c.trim()) + "</td>").join("") + "</tr>").join("") + "</table>"; continue; }
    if (/^\s*[-*•]\s+/.test(l)) { out += "<ul>"; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*[-*•]\s+/, "")) + "</li>"; out += "</ul>"; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { out += "<ol>"; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; out += "</ol>"; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += "<p>" + buf.map(inline).join("<br>") + "</p>";
  }
  return out;
}
// Where another tool's conversation continues (Parent Comms and the Lab builder reopen it; the coaches open fresh).
const continueHref = x => x.site === "parents" ? "/guides/parents/?t=" + encodeURIComponent(x.id) : x.site === "labs" ? "/guides/lifeskills/builder/?t=" + encodeURIComponent(x.id) : null;
const dayGroup = ms => { const d = new Date(ms || 0), t = new Date(); t.setHours(0, 0, 0, 0); const diff = (t - new Date(d).setHours(0, 0, 0, 0)) / 864e5; return diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : diff < 7 ? "Previous 7 days" : diff < 30 ? "Previous 30 days" : d.toLocaleDateString(undefined, { month: "long", year: "numeric" }); };

let db = null, user = null, log = null, items = [], cur = null, msgs = [], busy = false, relay = "", filter = "all", q = "", seq = 0;
const show = new URLSearchParams(location.search).get("show");
if (show && (show === "guide" || show in SITES)) filter = show;
function gate(msg) { app.innerHTML = ""; app.appendChild(h("section", { class: "gate" }, [h("h2", { text: "Trail Partner" }), h("p", { text: msg })])); }
async function onAuth(u) {
  const my = ++seq;
  if (!u) return gate("Sign in with your Wilderland account, top right, to talk with Trail Partner and see your conversations.");
  // Staff only (the account check is /auth.js's: admins, guests and the staff list).
  let r = window.wlRole;
  for (let i = 0; i < 100 && !(r && r.role); i++) { await new Promise(res => setTimeout(res, 50)); r = window.wlRole; }
  if (my !== seq) return;
  if (!r || r.role !== "staff") return gate("Trail Partner is for Wilderland guides and staff. If that's you, ask Alex to add your account.");
  user = u; db = getFirestore(window.wlFirebase.app); log = coachLog(db, u);
  layout();
  try { items = await log.list(); } catch (e) { console.warn(e); items = []; note("Couldn't load your past conversations. You can still start a new one."); }
  if (my !== seq) return;
  drawList(); route();
}
(async () => {
  while (!window.wlFirebase) await new Promise(r => setTimeout(r, 50));
  document.addEventListener("wl-auth", e => onAuth(e.detail));
  const a = window.wlFirebase.auth; if (a.authStateReady) { await a.authStateReady(); onAuth(a.currentUser); }
})();

// ---------- layout ----------
let E = {};
function layout() {
  app.innerHTML = "";
  const search = h("input", { type: "search", placeholder: "Search your conversations", "aria-label": "Search your conversations" });
  search.addEventListener("input", () => { q = search.value.trim().toLowerCase(); drawList(); });
  const sel = h("select", { "aria-label": "Show" }, [["all", "All conversations"], ["guide", "Trail Partner"], ...Object.entries(SITES).filter(([k]) => k !== "guide").map(([k, v]) => [k, v.label])].map(([k, l]) => h("option", { value: k, text: l, selected: filter === k })));
  sel.addEventListener("change", () => { filter = sel.value; drawList(); });
  const side = h("aside", { class: "side", "aria-label": "Your conversations" }, [
    h("div", { class: "side-top" }, [h("button", { class: "newbtn", type: "button", onclick: () => { location.hash = "new"; closeSide(); } }, [h("span", { "aria-hidden": "true", text: "🐲" }), "New conversation"]), search, sel]),
    h("div", { class: "threads", role: "list" })]);
  const scrim = h("div", { class: "scrim", onclick: closeSide });
  const head = h("div", { class: "mhead" });
  const logEl = h("div", { class: "log", "aria-live": "polite" }, [h("div", { class: "col" })]);
  const input = h("textarea", { id: "tp-in", rows: "1", maxlength: "6000", placeholder: "Ask Trail Partner anything about your work…", "aria-label": "Ask Trail Partner" });
  const send = h("button", { class: "send", type: "submit", text: "Send" });
  const form = h("form", {}, [input, send]);
  const foot = h("div", { class: "foot" }, [form, h("p", { class: "hint", text: "AI can be wrong. Check anything about safety or the law with an admin. Only you can see these conversations." })]);
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(220, input.scrollHeight) + "px"; });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  logEl.addEventListener("click", e => { const c = e.target.closest("[data-ask]"); if (c) ask(c.getAttribute("data-ask")); });
  app.append(side, scrim, h("main", { class: "main" }, [head, logEl, foot]));
  E = { side, scrim, threads: side.querySelector(".threads"), head, log: logEl, col: logEl.firstChild, input, send, foot };
}
function openSide() { E.side.classList.add("open"); E.scrim.classList.add("on"); }
function closeSide() { E.side.classList.remove("open"); E.scrim.classList.remove("on"); }
function drawList() {
  if (!E.threads) return;
  E.threads.innerHTML = "";
  const shown = items.filter(x => (filter === "all" || x.site === filter) && (!q || (x.title || "").toLowerCase().includes(q)));
  if (!shown.length) { E.threads.append(h("p", { class: "none", text: items.length ? "No conversations match." : "Your conversations will show here." })); return; }
  let g = "";
  shown.forEach(x => {
    const gg = dayGroup(x.updated); if (gg !== g) { g = gg; E.threads.append(h("p", { class: "grp", text: g })); }
    const site = SITES[x.site] || { label: x.site };
    E.threads.append(h("button", { class: "th c-" + x.site, role: "listitem", "aria-current": String(!!cur && cur.id === x.id), onclick: () => { location.hash = x.id; closeSide(); } }, [
      h("i", { "aria-hidden": "true", text: ICON[x.site] || "•" }), h("span", {}, [h("b", { text: x.title || "Conversation" }), h("small", { text: x.site === "guide" ? "Trail Partner" : site.label.replace(/ 🐲$/, "") + (KINDS[x.kind] ? " · " + KINDS[x.kind] : "") })])]));
  });
}
function header(x) {
  E.head.innerHTML = "";
  E.head.className = "mhead c-" + (x ? x.site : "guide");
  const del = x ? h("button", { class: "ib del", type: "button", text: "Delete" }) : null;
  if (del) del.onclick = async () => {
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Tap again to delete"; setTimeout(() => { del.classList.remove("sure"); del.textContent = "Delete"; }, 4000); return; }
    del.disabled = true;
    try { await log.remove(x.id); items = items.filter(i => i.id !== x.id); location.hash = "new"; drawList(); } catch (e) { del.disabled = false; del.textContent = "Couldn't delete"; }
  };
  E.head.append(
    h("button", { class: "ib sidebtn", type: "button", "aria-label": "Your conversations", onclick: openSide, text: "☰ Chats" }),
    h("div", { style: "flex:1;min-width:0;display:flex;flex-direction:column" }, [h("span", { class: "tag", text: x && x.site !== "guide" ? (SITES[x.site] || { label: x.site }).label : "Trail Partner 🐲" }), h("h1", { text: x ? x.title || "Conversation" : "New conversation" })]),
    x ? h("button", { class: "ib", type: "button", text: "Copy", onclick: async e => { try { await navigator.clipboard.writeText((cur.messages || []).map(m => (m.role === "user" ? "You:\n" : "Trail Partner:\n") + m.content).join("\n\n")); e.target.textContent = "Copied"; } catch (er) { e.target.textContent = "Couldn't copy"; } } }) : null,
    del);
}
function note(t) { if (E.col) E.col.append(h("div", { class: "m note", text: t })); }

// ---------- one conversation ----------
async function route() {
  if (!log) return;
  const id = decodeURIComponent(location.hash.slice(1));
  const p = new URLSearchParams(location.search);
  if (!id || id === "new") return startNew(p.get("ask"), p.get("q"));
  if (cur && cur.id === id) return;
  E.col.innerHTML = ""; note("Opening…");
  let x = null; try { x = await log.get(id); } catch (e) { x = null; }
  if (decodeURIComponent(location.hash.slice(1)) !== id) return;
  if (!x) { E.col.innerHTML = ""; note("That conversation couldn't be opened. It may have been deleted."); header(null); return; }
  cur = x; msgs = (x.messages || []).map(m => ({ ...m }));
  drawList(); header(x); drawMsgs();
}
function startNew(askText, prefill) {
  cur = null; msgs = [];
  if (askText || prefill) history.replaceState(null, "", location.pathname + "#new");
  drawList(); header(null); drawMsgs();
  if (prefill) { E.input.value = prefill; E.input.dispatchEvent(new Event("input")); }
  if (askText) ask(askText);
  setTimeout(() => E.input.focus(), 50);
}
addEventListener("hashchange", route);
function drawMsgs() {
  E.col.innerHTML = "";
  const other = cur && cur.site !== "guide";
  E.foot.hidden = !!other;
  if (!msgs.length) {
    E.col.append(h("div", { class: "hello" }, [h("div", { class: "big", "aria-hidden": "true", text: "🐲" }), h("h2", { text: "Think it through with a fellow guide." }),
      h("p", { text: "Trail Partner knows our Staff Handbook, Behavior Policy, the Mentor Mindset Field Guide, Our Approach and At Home, and tells you which one it's drawing on. Bring a situation, a draft, a plan or a question." }),
      h("div", { class: "chips" }, STARTERS.map(s => h("button", { class: "chip", type: "button", "data-ask": s, text: s })))]));
    return;
  }
  const label = other ? ICON[cur.site] : "🐲";
  const list = other && cur.meta && cur.meta.firstShown ? msgs.map((m, i) => i === 0 && m.role === "user" ? { ...m, content: cur.meta.firstShown } : m) : msgs;
  list.forEach(m => bubble(m, label, other));
  if (other) {
    const site = SITES[cur.site] || { label: cur.site, href: "/guides/" }, cont = continueHref(cur);
    E.col.append(h("div", { class: "other-note c-" + cur.site }, [h("span", { text: "This conversation is from " + site.label + "." }), h("a", { class: "ib", href: cont || site.href, text: cont ? "Continue it there" : "Open " + site.label })]));
  }
  E.log.scrollTop = E.log.scrollHeight;
}
function bubble(m, label, other) {
  if (m.err) { note(m.content); return; }
  if (m.role === "user") E.col.append(h("div", { class: "m me", text: m.content }));
  else E.col.append(h("div", { class: "m ai" + (other ? " other c-" + cur.site : "") }, [h("div", { class: "av", "aria-hidden": "true", text: label }), h("div", { class: "txt", html: md(m.content) })]));
  E.log.scrollTop = E.log.scrollHeight;
}
async function relayUrl() {
  if (relay) return relay;
  const d = await getDoc(doc(db, "mentorConfig", "main"));
  relay = d.exists() ? d.data().relay || "" : "";
  if (!relay) throw new Error("no relay");
  return relay;
}
async function ask(text) {
  text = String(text || "").trim();
  if (!text || busy || (cur && cur.site !== "guide")) return;
  E.input.value = ""; E.input.style.height = "auto";
  if (!msgs.length) E.col.innerHTML = "";
  msgs.push({ role: "user", content: text }); bubble(msgs[msgs.length - 1], "🐲");
  busy = true; E.send.disabled = true;
  const t = h("div", { class: "typing", text: "Looking through our documents…" }); E.col.append(t); E.log.scrollTop = E.log.scrollHeight;
  try {
    const hist = msgs.filter(m => !m.err).slice(-20).map(m => ({ role: m.role, content: m.content }));
    const r = await fetch(await relayUrl(), { method: "POST", headers: { Authorization: "Bearer " + await user.getIdToken(), "Content-Type": "application/json" }, body: JSON.stringify({ mode: "mentor", messages: hist }) });
    const j = await r.json().catch(() => ({}));
    t.remove();
    if (!r.ok) { const m = { role: "assistant", content: r.status === 403 ? "Trail Partner is for Wilderland school staff accounts." : j.error || "Something went wrong. Try again in a minute.", err: true }; msgs.push(m); bubble(m); }
    else {
      const m = { role: "assistant", content: j.text + (j.stop === "max_tokens" ? "\n\n(That answer was cut short. Ask me to keep going.)" : "") };
      msgs.push(m); bubble(m, "🐲");
      try {
        const isNew = !cur;
        if (isNew) cur = { id: log.newId(), site: "guide", kind: "chat", created: Date.now() };
        await log.save({ id: cur.id, site: "guide", kind: "chat", messages: msgs, created: cur.created });
        const saved = { id: cur.id, site: "guide", kind: "chat", title: cur.title || (msgs.find(x => x.role === "user") || {}).content.slice(0, 90), created: cur.created, updated: Date.now(), count: msgs.length };
        cur.title = saved.title; cur.messages = msgs;
        items = [saved, ...items.filter(i => i.id !== cur.id)];
        if (isNew) history.replaceState(null, "", location.pathname + "#" + cur.id);
        header(cur); drawList();
      } catch (e) { console.warn("Couldn't save the conversation", e); }
    }
  } catch (e) {
    t.remove();
    const m = { role: "assistant", content: e.message === "no relay" ? "The AI isn't switched on yet. Tell Alex." : "Couldn't reach Trail Partner. Check your connection and try again.", err: true };
    msgs.push(m); bubble(m);
  }
  busy = false; E.send.disabled = false; E.input.focus();
}
// The 🐲 button in the top bar works here too: it starts a new conversation (or fills in a question) on this page.
window.wlOpenMentor = opts => {
  if (!log) return Promise.resolve();
  if (opts && opts.threadId) { location.hash = opts.threadId; return Promise.resolve(); }
  if (opts && (opts.ask || opts.prefill)) { if (cur || msgs.length) location.hash = "new"; setTimeout(() => { if (opts.ask) ask(opts.ask); else { E.input.value = opts.prefill; E.input.focus(); } }, 60); return Promise.resolve(); }
  location.hash = "new"; return Promise.resolve();
};
</script>

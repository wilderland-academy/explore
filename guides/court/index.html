<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Court desk · Wilderland Guides</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#01412f">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<link rel="stylesheet" href="/guides/roster/roster.css">
<style>
  .pill{display:inline-block;font:700 11px/1.6 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 9px;background:#ece5d9;color:var(--ink)}
  .pill.warn{background:var(--high-bg);color:var(--high)} .pill.bad{background:var(--urgent-bg);color:var(--urgent)} .pill.ok{background:#e6efe9;color:var(--green)}
  dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:4px 0;font-size:14.5px} dl.kv dt{color:var(--dim);font-weight:600} dl.kv dd{margin:0}
  details.card>summary{cursor:pointer;list-style:none} details.card>summary::-webkit-details-marker{display:none}
  .sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px}
  select.in,input.in{min-width:0}
</style>
</head>
<body>
<div class="wlbar" data-wlnav="guides" data-current="behavior"></div><script src="/wlnav.js"></script>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/court/rules.js"></script>
<script src="/court/fs.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="/auth.js" data-site="court-staff"></script>
</body>
</html>

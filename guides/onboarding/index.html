<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · Wilderland Guides</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#01412f">
<link rel="icon" href="/books/f/icon.png">
<link rel="stylesheet" href="/wl.css">
<style>
@font-face{font-family:"Inter";src:url(/books/f/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;--paper:#f5f1ea;--sheet:#fffdf9;--line:#ddd3c4;--ink:#231b24;--dim:#625a63;--g:#01412f;--ok:#0b6b3a;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body)}
.wrap{max-width:1160px;margin:0 auto;padding:32px 18px 80px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
#meter{display:flex;flex-direction:column;gap:6px;font-size:14px}
.bar{display:block;height:6px;border-radius:99px;background:#e6dccd;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
#steps{display:flex;flex-direction:column;gap:4px}
.st{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;border:1px solid transparent}
.st i{font-style:normal;width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#ebe3d6}
.st b{display:block;font-size:15px}.st small{display:block;color:var(--dim);font-size:12.5px}
a.st:hover{background:var(--sheet);border-color:var(--line)}
.st.on{background:var(--sheet);border-color:var(--g)}
.st.done i{background:var(--ok);color:#fff}
.st.lock{opacity:.55}
.st.team{margin-top:8px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4.6vw,44px)} h1 span{font-style:italic;color:#8a2d55}
h2{font-size:26px;margin-top:10px}
h3{margin:0;font-size:18px}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font:700 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0}
.lede{font-size:18px;color:var(--dim);max-width:62ch;margin:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card.ok{border-color:var(--ok);background:#eef6ef}
.lessons{display:flex;flex-direction:column;gap:12px}
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson p,.lesson ul{margin:0}.lesson ul{padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.lesson.read{border-color:#b9d3bf}
.lh{display:flex;gap:10px;align-items:center}
.lh .n{width:26px;height:26px;border-radius:50%;background:#ebe3d6;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.lesson.read .lh .n{background:var(--ok);color:#fff}
.links{display:flex;flex-wrap:wrap;gap:8px 16px}.links a{color:var(--g);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mark{font:600 14px var(--body);border:1.5px solid var(--g);color:var(--g);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
.mark.on{background:var(--ok);border-color:var(--ok);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bd{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.bd small{color:var(--dim)}.bd.done{border-color:var(--ok);background:#eef6ef}
a.bd:hover{border-color:var(--g)}
.quiz{max-width:760px}
.next{display:flex;justify-content:flex-end;padding-top:8px}
.btn{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:11px 20px;font-weight:600;text-decoration:none}
.dim{color:var(--dim);margin:0}.small{font-size:14px}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}td:first-child,th:first-child{text-align:left}
aside{min-width:0}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);padding-top:18px;gap:18px}aside{position:static}#steps{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}.st{flex:none}.st small{display:none}}
</style>
</head>
<body>
<div class="wlbar" data-wlnav="guides" data-current="onboarding"></div><script src="/wlnav.js"></script>
<div class="wrap">
  <aside aria-label="Onboarding steps">
    <p class="eyebrow">Guide onboarding</p>
    <div id="meter"></div>
    <nav id="steps"></nav>
  </aside>
  <main id="view"><p class="dim">Loading your progress…</p></main>
</div>
<script type="module" src="/auth.js" data-site="onboarding"></script>
<script type="module" src="/guides/onboarding/app.js"></script>
</body>
</html>
